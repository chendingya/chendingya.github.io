# 奶油杂志 × 多巴胺 主题配置
# 变量名直接对应 CSS 变量（--key: value）

name: "奶油杂志"
version: "2.0"

# ── 字体 ──
fonts:
  --font-display: "'Playfair Display', 'Noto Serif SC', Georgia, 'Times New Roman', serif"
  --font-body: "'Public Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  --font-mono: "'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace"

# ── 浅色模式颜色 ──
light:
  --bg-cream: "#FEFAF6"
  --bg-cream-alpha: "rgba(254,250,246,0.85)"
  --bg-surface: "#FFFFFF"
  --bg-warm: "#FDF5EB"
  --text-primary: "#2C1810"
  --text-secondary: "#8B7355"
  --text-muted: "#C4A882"
  --text-on-accent: "#FFFFFF"
  --border: "#E8D5C4"
  --border-light: "#F0E3D5"
  --shadow-sm: "0 1px 2px rgba(44,24,16,0.04)"
  --shadow-md: "0 4px 12px rgba(44,24,16,0.06)"
  --shadow-lg: "0 12px 32px rgba(44,24,16,0.08)"
  --code-bg: "#1E1E1E"
  --code-text: "#E0E0E0"
  --brand: "var(--accent-coral)"
  --brand-hover: "#FF5252"
  --brand-alpha: "rgba(255,107,107,0.08)"
  --brand-alpha-heavy: "rgba(255,107,107,0.15)"
  --selection-bg: "rgba(255,107,107,0.2)"

# ── 暗色模式颜色 ──
dark:
  --bg-cream: "#1A1614"
  --bg-cream-alpha: "rgba(26,22,20,0.85)"
  --bg-surface: "#2C2420"
  --bg-warm: "#241E1A"
  --text-primary: "#E8D5C4"
  --text-secondary: "#B8A088"
  --text-muted: "#8B7355"
  --text-on-accent: "#FFFFFF"
  --border: "#3D3028"
  --border-light: "#332A22"
  --shadow-sm: "0 1px 2px rgba(0,0,0,0.2)"
  --shadow-md: "0 4px 12px rgba(0,0,0,0.25)"
  --shadow-lg: "0 12px 32px rgba(0,0,0,0.3)"
  --code-bg: "#111111"
  --code-text: "#E0E0E0"
  --brand: "var(--accent-coral)"
  --brand-hover: "#FF8A8A"
  --brand-alpha: "rgba(255,107,107,0.12)"
  --brand-alpha-heavy: "rgba(255,107,107,0.2)"
  --selection-bg: "rgba(255,107,107,0.2)"

# ── 多巴胺点缀色 ──
accent:
  --accent-coral: "#FF6B6B"
  --accent-coral-hover: "#FF5252"
  --accent-amber: "#F4A261"
  --accent-mint: "#90BE6D"
  --accent-lavender: "#9B72AA"
  --accent-sky: "#4ECDC4"
  --accent-sun: "#F9C74F"
  --accent-rose: "#FF6B8A"
  --accent-blue: "#577590"

# ── 布局 ──
layout:
  --max-width: "1200px"
  --content-width: "720px"

# ── 间距 ──
space:
  --space-xs: "0.25rem"
  --space-sm: "0.5rem"
  --space-md: "1rem"
  --space-lg: "1.5rem"
  --space-xl: "2rem"
  --space-2xl: "3rem"
  --space-3xl: "5rem"

# ── 圆角 ──
radius:
  --radius-sm: "4px"
  --radius-md: "8px"
  --radius-lg: "16px"
  --radius-xl: "24px"

# ── 过渡 ──
easing:
  --ease-out: "cubic-bezier(0.16, 1, 0.3, 1)"
  --ease-in-out: "cubic-bezier(0.65, 0, 0.35, 1)"
  --duration-fast: "150ms"
  --duration-normal: "300ms"
  --duration-slow: "500ms"
